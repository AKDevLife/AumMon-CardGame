name: Sync playtest branch

# Keeps the `playtest` branch equal to `main` so Vercel's branch URL
# (https://aum-mon-card-game-git-playtest-aum-mon.vercel.app) always shows the
# latest merged build. Preview environment only — never Production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-playtest
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fast-forward playtest to main
        run: git push origin HEAD:refs/heads/playtest # fast-forward only; fails if playtest diverged
