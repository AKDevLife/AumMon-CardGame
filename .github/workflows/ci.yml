name: CI

# Actions minutes are limited on this private repo (2,000/month): CI runs once per PR
# (main only receives squash merges of PRs that already passed), and docs-only changes skip it.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Unit & architecture tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Secret check (repo + client bundle)
        run: pnpm check:secrets

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:17.6.1.054
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: Migrate and test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash scripts/db-test.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-auth:
    name: Backend + E2E (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync engine into Edge Functions (import map target)
        run: pnpm sync:engine
      - name: Start local Supabase (no cloud)
        run: >-
          pnpm exec supabase start -x
          studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta,storage-api
      - name: Serve Edge Functions and check the engine boots under Deno
        run: |
          pnpm sync:engine
          nohup pnpm exec supabase functions serve --no-verify-jwt --env-file supabase/functions/ci-dev.env > /tmp/functions.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:54321/functions/v1/engine-health | grep -q '"rulesetVersion":"5"'; then exit 0; fi
            sleep 3
          done
          cat /tmp/functions.log; exit 1
      - name: Export local public env
        run: |
          pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > /tmp/sb.env
          . /tmp/sb.env
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - name: Backend integration tests (Edge Functions + DB)
        run: pnpm exec vitest run tests/backend
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright against local backend
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-auth
          path: playwright-report/
          retention-days: 7
